[project]
name = "cache-raiders"
version = "0.1.0"
description = "A Pygame demo comparing object and packed-array entity storage"
readme = "README.md"
authors = [
    { name = "Erick", email = "hearteric57@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
cache-raiders = "cache_raiders:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
